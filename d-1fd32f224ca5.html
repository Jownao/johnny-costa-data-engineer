<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>J &amp; M ❤️</title>
  <link rel="icon" href="assets/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, #1a0f2e 0%, #2d1b4e 50%, #1a0f2e 100%);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 30px 0;
    }

    .heart-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      bottom: -40px;
      opacity: 0;
      animation: float linear infinite;
    }

    @keyframes float {
      0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
      15%  { opacity: 0.45; }
      100% { transform: translateY(-110vh) translateX(30px) rotate(360deg); opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 560px;
      width: 90%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      padding: 50px 32px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.8s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .initials {
      font-family: 'Playfair Display', serif;
      font-size: 3.4rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: linear-gradient(135deg, #ff6b9d 0%, #ff8fab 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .initials .amp {
      font-size: 1.8rem;
      -webkit-text-fill-color: initial;
      animation: heartbeat 1.2s infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      25%      { transform: scale(1.25); }
      50%      { transform: scale(1); }
    }

    .names {
      color: #ffc0d9;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-size: 0.85rem;
      margin-top: 6px;
    }

    .since {
      margin-top: 34px;
      color: #e8d5e8;
      font-weight: 300;
    }

    .big-number {
      font-family: 'Playfair Display', serif;
      font-size: 7rem;
      font-weight: 900;
      line-height: 1;
      margin: 6px 0 0;
      color: #fff;
      text-shadow: 0 0 40px rgba(255, 107, 157, 0.5);
    }

    .big-label {
      font-size: 1.3rem;
      color: #ff8fab;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .details {
      display: flex;
      gap: 12px;
      margin-top: 30px;
    }

    .detail {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 16px 8px;
    }

    .detail strong {
      display: block;
      font-size: 1.6rem;
      font-weight: 600;
      color: #fff;
    }

    .detail span {
      font-size: 0.8rem;
      color: #ffc0d9;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .milestone {
      margin-top: 30px;
      text-align: left;
      background: rgba(255, 255, 255, 0.05);
      border-left: 4px solid #ff6b9d;
      border-radius: 15px;
      padding: 18px 22px;
      color: #e8d5e8;
      font-size: 0.95rem;
    }

    .bar {
      height: 8px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 99px;
      margin-top: 12px;
      overflow: hidden;
    }

    .bar > div {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #ff6b9d, #ffc0d9);
      border-radius: 99px;
      transition: width 1s ease-out;
    }

    .footer {
      margin-top: 28px;
      font-size: 0.8rem;
      color: rgba(255, 192, 217, 0.6);
    }

    @media (max-width: 480px) {
      .container { padding: 40px 20px; }
      .big-number { font-size: 5.5rem; }
      .initials { font-size: 2.8rem; }
    }
  </style>
</head>
<body>
  <div class="heart-bg" id="hearts"></div>

  <main class="container">
    <div class="initials"><span>J</span><span class="amp">❤️</span><span>M</span></div>
    <div class="names">Johnny &amp; Micaele</div>

    <p class="since">Desde 06/09/2026 a gente se conhece há</p>
    <div class="big-number" id="days">0</div>
    <div class="big-label" id="daysLabel">dias</div>

    <div class="details">
      <div class="detail"><strong id="weeks">0</strong><span>semanas</span></div>
      <div class="detail"><strong id="restDays">0</strong><span>dias extras</span></div>
      <div class="detail"><strong id="hours">0</strong><span>horas</span></div>
    </div>

    <div class="milestone">
      <div id="milestoneText"></div>
      <div class="bar"><div id="milestoneBar"></div></div>
    </div>

    <p class="footer">O tempo passa, e cada dia conta ✨</p>
  </main>

  <script>
    // Data em que se conheceram (ano, mês [0-11], dia) — no horário local.
    const START = new Date(2026, 8, 6);

    const MILESTONES = [7, 10, 15, 20, 30, 50, 60, 90, 100, 150, 200, 250, 300, 365, 500, 730, 1000];

    const $ = (id) => document.getElementById(id);

    function daysSince() {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      // Math.round absorve mudanças de horário de verão
      return Math.max(0, Math.round((today - START) / 86400000));
    }

    function render() {
      const d = daysSince();
      $('days').textContent = d;
      $('daysLabel').textContent = d === 1 ? 'dia' : 'dias';
      $('weeks').textContent = Math.floor(d / 7);
      $('restDays').textContent = d % 7;
      $('hours').textContent = Math.max(0, Math.floor((Date.now() - START) / 3600000)).toLocaleString('pt-BR');

      const next = MILESTONES.find((m) => m > d);
      const prev = [...MILESTONES].reverse().find((m) => m <= d) || 0;
      if (next) {
        const left = next - d;
        $('milestoneText').textContent =
          `Próximo marco: ${next} dias — falta${left === 1 ? '' : 'm'} ${left} dia${left === 1 ? '' : 's'} 💫`;
        $('milestoneBar').style.width = ((d - prev) / (next - prev)) * 100 + '%';
      } else {
        $('milestoneText').textContent = 'Já passamos de todos os marcos, e o melhor ainda vem 💖';
        $('milestoneBar').style.width = '100%';
      }
    }

    // Atualiza sozinho à meia-noite (e a cada minuto, cobre a aba aberta/suspensa)
    function scheduleMidnight() {
      const now = new Date();
      const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 1);
      setTimeout(() => { render(); scheduleMidnight(); }, next - now);
    }

    render();
    scheduleMidnight();
    setInterval(render, 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

    // Corações flutuando ao fundo
    const box = $('hearts');
    ['💗', '💖', '💕', '❤️'].forEach((h, i) => {
      for (let n = 0; n < 4; n++) {
        const el = document.createElement('span');
        el.className = 'floating-heart';
        el.textContent = h;
        el.style.left = Math.random() * 100 + '%';
        el.style.fontSize = 1 + Math.random() * 1.5 + 'rem';
        el.style.animationDuration = 8 + Math.random() * 8 + 's';
        el.style.animationDelay = Math.random() * 10 + 's';
        box.appendChild(el);
      }
    });
  </script>
</body>
</html>
